  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="1665" y="212">Ranked Provider List</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="1665" y="251">• Ordered by reliability score</text>
  <rect fill="white" height="156" rx="10" ry="10" stroke="#2563A6" stroke-width="2" width="395" x="1648" y="365"/>
  <rect fill="#2563A6" height="39" rx="9" ry="9" width="395" x="1648" y="365"/>
  <rect fill="#2563A6" height="19" width="395" x="1648" y="385"/>
