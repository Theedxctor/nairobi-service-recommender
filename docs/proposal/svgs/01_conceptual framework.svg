  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="1665" y="431">• Traffic-adjusted ETA per provider</text>
  <rect fill="white" height="156" rx="10" ry="10" stroke="#D97812" stroke-width="2" width="395" x="1648" y="545"/>
  <rect fill="#D97812" height="39" rx="9" ry="9" width="395" x="1648" y="545"/>
  <rect fill="#D97812" height="19" width="395" x="1648" y="565"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="1665" y="572">Reliability Score (0–1)</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="1665" y="611">• XGBoost prediction output</text>
  <rect fill="white" height="156" rx="10" ry="10" stroke="#7143A4" stroke-width="2" width="395" x="1648" y="725"/>
  <rect fill="#7143A4" height="39" rx="9" ry="9" width="395" x="1648" y="725"/>
  <rect fill="#7143A4" height="19" width="395" x="1648" y="745"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="1665" y="752">Explainability Layer</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="1665" y="791">• Factors driving each recommendation</text>
  <rect fill="white" height="156" rx="10" ry="10" stroke="#287047" stroke-width="2" width="395" x="1648" y="905"/>
  <rect fill="#287047" height="39" rx="9" ry="9" width="395" x="1648" y="905"/>
  <rect fill="#287047" height="19" width="395" x="1648" y="925"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="1665" y="932">Booking Confirmation</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="1665" y="971">• Confirmed booking with provider details</text>
