<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="1330px" version="1.1" viewBox="0 0 2100 1330" width="2100px">
  <defs/>
  <rect fill="#fff" height="1330" width="2100" x="0" y="0"/>
  <text fill="#152B52" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="1050.0" y="49">NaiServe — Context-Aware Recommendation System</text>
  <text fill="#53647A" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="1050.0" y="77">Actors, data preparation, ensemble prediction, recommendation outputs, and feedback</text>
  <rect fill="#F6F9FC" height="1080" rx="13" ry="13" stroke="#152B52" stroke-width="2" width="400" x="35" y="104"/>
  <rect fill="#F6F9FC" height="1080" rx="13" ry="13" stroke="#152B52" stroke-width="2" width="1130" x="465" y="104"/>
  <rect fill="#F6F9FC" height="1080" rx="13" ry="13" stroke="#152B52" stroke-width="2" width="440" x="1625" y="104"/>
  <rect fill="#152B52" height="55" width="400" x="35" y="104"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="235.0" y="139">USERS / ACTORS</text>
  <rect fill="#152B52" height="55" width="1130" x="465" y="104"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="1030.0" y="139">CONTEXT-AWARE RECOMMENDATION SYSTEM</text>
  <rect fill="#7143A4" height="55" width="440" x="1625" y="104"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="1845.0" y="139">SYSTEM OUTPUTS</text>
  <rect fill="white" height="217" rx="10" ry="10" stroke="#2563A6" stroke-width="2" width="353" x="58" y="191"/>
  <rect fill="#2563A6" height="39" rx="9" ry="9" width="353" x="58" y="191"/>
  <rect fill="#2563A6" height="19" width="353" x="58" y="211"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="75" y="218">CLIENT</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="257">• Submits service request</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="283">• Selects service type and location</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="309">• Views ranked provider list</text>
  <rect fill="white" height="217" rx="10" ry="10" stroke="#0C777B" stroke-width="2" width="353" x="58" y="441"/>
  <rect fill="#0C777B" height="39" rx="9" ry="9" width="353" x="58" y="441"/>
  <rect fill="#0C777B" height="19" width="353" x="58" y="461"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="75" y="468">SERVICE PROVIDER</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="507">• Registers profile and availability</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="533">• Declares service area and rates</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="559">• Receives booking notifications</text>
  <rect fill="white" height="243" rx="10" ry="10" stroke="#7143A4" stroke-width="2" width="353" x="58" y="690"/>
  <rect fill="#7143A4" height="39" rx="9" ry="9" width="353" x="58" y="690"/>
  <rect fill="#7143A4" height="19" width="353" x="58" y="710"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="75" y="717">SYSTEM ADMINISTRATOR</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="756">• Approves provider profiles</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="782">• Monitors system performance</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" x="75" y="808">• Triggers model retraining</text>
  <rect fill="white" height="190" rx="10" ry="10" stroke="#152B52" stroke-width="2" width="1070" x="495" y="185"/>
  <rect fill="#152B52" height="39" rx="9" ry="9" width="1070" x="495" y="185"/>
  <rect fill="#152B52" height="19" width="1070" x="495" y="205"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="512" y="212">1. DATA INPUT &amp; COLLECTION</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="251">• User request: service type, location, booking time</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="277">• Provider profiles: ratings, cost, availability, base location</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="303">• Traffic data: corridor congestion multipliers by time slot</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="329">• Road quality classifications by Nairobi neighbourhood</text>
  <rect fill="white" height="204" rx="10" ry="10" stroke="#0C777B" stroke-width="2" width="1070" x="495" y="412"/>
  <rect fill="#0C777B" height="39" rx="9" ry="9" width="1070" x="495" y="412"/>
  <rect fill="#0C777B" height="19" width="1070" x="495" y="432"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="512" y="439">2. GEOSPATIAL &amp; TRAFFIC PROCESSING</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="478">• Compute Haversine distance between provider and client</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="504">• Apply corridor congestion multiplier for booking time slot</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="530">• Generate estimated travel time per candidate provider</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" x="512" y="556">• Classify road quality for the provider’s area</text>
  <rect fill="white" height="223" rx="10" ry="10" stroke="#D97812" stroke-width="2" width="1070" x="495" y="654"/>
  <rect fill="#D97812" height="39" rx="9" ry="9" width="1070" x="495" y="654"/>
  <rect fill="#D97812" height="19" width="1070" x="495" y="674"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="512" y="681">3. FEATURE ENGINEERING &amp; ML MODEL</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="720">• Assemble five model inputs: distance, congestion multiplier and time slot</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="746">• Add provider-area road quality and provider completion rate</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="772">• Apply the XGBoost ensemble model trained on synthetic booking data</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="798">• Predict arrival-reliability score (0–1.0) per provider</text>
  <rect fill="white" height="189" rx="10" ry="10" stroke="#287047" stroke-width="2" width="1070" x="495" y="915"/>
  <rect fill="#287047" height="39" rx="9" ry="9" width="1070" x="495" y="915"/>
  <rect fill="#287047" height="19" width="1070" x="495" y="935"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" x="512" y="942">4. RANKING &amp; EXPLAINABILITY ENGINE</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="981">• Remove unavailable providers before model scoring</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="1007">• Sort available providers by predicted reliability score</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="1033">• Attach explainability factors to each ranked result</text>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" x="512" y="1059">• Deliver output to Next.js web interface</text>
  <rect fill="#F1F5FA" height="64" rx="13" ry="13" stroke="#152B52" stroke-width="2" width="760" x="660" y="1127"/>
  <text fill="#152B52" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="1040" y="1152">DATA STORAGE — PostgreSQL + PostGIS</text>
  <text fill="#53647A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040" y="1178">Providers • Bookings • Traffic patterns • Nairobi areas</text>
